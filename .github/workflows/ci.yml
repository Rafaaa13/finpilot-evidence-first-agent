name: FinPilot CI
on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m finpilot demo --ticker AAPL --as-of 2025-12-31 --output /tmp/finpilot-demo
      - run: python -m finpilot eval --output /tmp/finpilot-eval.json
      - run: python -m json.tool /tmp/finpilot-eval.json >/dev/null
